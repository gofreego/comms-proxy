name: Build and Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "k8s/**"

permissions:
  contents: write
  packages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=pilot-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gofreego/comms-proxy:${{ steps.vars.outputs.tag }}

      - name: Update k8s manifest
        run: |
          sed -i "s|image: .*comms-proxy:.*|image: ghcr.io/gofreego/comms-proxy:${{ steps.vars.outputs.tag }}|" k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: deploy comms-proxy ${{ steps.vars.outputs.tag }} [skip ci]"
          git push
